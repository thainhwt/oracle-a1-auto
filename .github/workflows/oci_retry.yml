name: OCI ARM Retry

on:
  workflow_dispatch:

concurrency:
  group: oci-a1-retry
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI SDK
        run: python -m pip install oci requests

      - name: Set up OCI credentials
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for item in OCI_USER OCI_FINGERPRINT OCI_TENANCY OCI_REGION OCI_PRIVATE_KEY; do
            if [[ -z "${!item}" ]]; then
              echo "Missing GitHub Actions secret: $item" >&2
              exit 1
            fi
          done
          mkdir -p ~/.oci
          chmod 700 ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Try creating one A1
        id: attempt
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          A1_SSH_PUBLIC_KEY: ${{ secrets.A1_SSH_PUBLIC_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          set +e
          timeout 19800 python oci_retry.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stop retry workflow after success
        if: ${{ steps.attempt.outputs.code == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/oci_retry.yml/disable"

      - name: Start next retry session after timeout
        if: ${{ steps.attempt.outputs.code == '124' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/oci_retry.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Report configuration or API error
        if: ${{ steps.attempt.outputs.code != '0' && steps.attempt.outputs.code != '124' }}
        run: |
          echo "A1 retry stopped because configuration or OCI API failed. Check the step above." >&2
          exit 1
